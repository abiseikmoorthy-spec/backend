<body>
    <h1>positive or negative</h1>
    <script>
        let arr=[-2,2,-3,3]
        for(let i=0; i<arr.length; i++){
            if (arr[i]>0) {
                console.log("positive");
                    
            }
            if(arr[i]<0){
                console.log("negative");
                
        }
        }
    </script>
